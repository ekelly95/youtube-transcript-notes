[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "youtube-transcript-notes"
# Keep package metadata and `--version` on one source of truth.
dynamic = ["version"]
description = "Turn lecture videos into readable, citable study material."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lecture", "transcript", "captions", "citation", "study-notes"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ekelly95/youtube-transcript-notes"
Repository = "https://github.com/ekelly95/youtube-transcript-notes"
Issues = "https://github.com/ekelly95/youtube-transcript-notes/issues"

[project.optional-dependencies]
# Acquisition stays optional so parsing and rendering have no third-party
# dependencies. Keep yt-dlp floor-only: upgrading is the normal repair after a
# YouTube change; `_require_shape` and the live canary check compatibility.
# `[default]` brings yt-dlp-ejs, which YouTube extraction needs since 2025.11.12.
youtube = ["yt-dlp[default]>=2025.11.12"]
dev = ["pytest>=8.3", "coverage>=7.6", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
youtube-transcript-notes = "youtube_transcript_notes.__main__:main"

[tool.hatch.version]
path = "src/youtube_transcript_notes/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_transcript_notes"]

[tool.hatch.build.targets.sdist]
# Tests hold CC BY-NC-SA caption fixtures and must not enter the MIT package.
# Agent and contributor files are repo-local instructions and stay out too.
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep list form so marker arguments behave identically on Windows and Unix.
# `network` is also used to test the guard itself, so exclude only `canary`.
addopts = ["--strict-markers", "--strict-config", "-m", "not canary"]
markers = [
    "network: test may open a real network connection (rare; the suite otherwise runs entirely from captured fixtures)",
    "canary: live check that the yt-dlp seam still fits YouTube. Opt in with `pytest -m canary`",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set so a Ruff upgrade does not silently redefine the gate.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "ISC",  # implicit string concatenation
    "RUF",  # ruff-specific
]

[tool.mypy]
# The package ships `py.typed`, so `src` is checked strictly. Tests are out of
# scope: nothing installs them, and their deliberate shortcuts (stubs, handles
# with no provider) are the point of a test.
files = ["src"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# yt-dlp ships no types; `_require_shape` checks its results at runtime.
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["youtube_transcript_notes"]
branch = true

[tool.coverage.report]
show_missing = true
# The dispatch shim is verified as a subprocess instead of in-process coverage.
omit = ["*/__main__.py"]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
