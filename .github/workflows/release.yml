name: Release

# Publishing is driven by a tag rather than a button, so that what reaches PyPI
# is always a named point in the history. `ci.yml` triggers on `push: branches`,
# which a tag push does not match — so the guards protecting the artefact are
# repeated here rather than assumed to have run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e ".[dev,youtube]"
      # A version number can never be re-used on PyPI, and a tag pointing at a
      # commit that was never on `main` would skip the matrix entirely. Both are
      # cheaper to catch here than after an upload that cannot be taken back.
      - name: The tag names the version being built
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/youtube_transcript_notes/__init__.py').read_text()).group(1))")
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $tag does not match __version__ $version"
            exit 1
          fi
      - name: Tests, on the exact commit being published
        run: pytest
      - run: python -m build
      - name: Metadata is well formed
        run: twine check dist/*
      # The MIT distribution must not include CC BY-NC-SA caption fixtures.
      - name: No test fixtures escaped into the sdist
        run: |
          if tar -tzf dist/*.tar.gz | grep -E 'tests/|fixtures/'; then
            echo "::error::test fixtures leaked into the sdist"
            exit 1
          fi
      - name: The typing marker shipped
        run: python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'youtube_transcript_notes/py.typed' in names, names"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: GitHub proves its own identity to PyPI at the moment
    # of upload, so no API token exists anywhere to be stored or leaked.
    #
    # Uploading is a separate job because `id-token: write` *is* the credential.
    # Keeping it on a job that only downloads a file and posts it means no build
    # or test code ever runs beside the ability to mint one.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
